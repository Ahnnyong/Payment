global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # host.docker.internal:8080 대신 서비스 이름을 적습니다.
      # 도커 컴포즈가 'spring-app'이라는 이름으로 떠 있는 모든 인스턴스를 찾을 수 있게 도와줍니다.
      - targets: ['spring-app:8080']