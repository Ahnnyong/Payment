version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9092,OUTSIDE://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9092,OUTSIDE://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "payment-topic:4:1"

  # Nginx: 외부 요청의 단일 진입점 (로드밸런서)
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - spring-app

  # 스프링 부트 4개 (Scale-out)
  spring-app:
    build: ./payment-system # 스프링 프로젝트 폴더 내 Dockerfile
    deploy:
      replicas: 4
    expose:
      - "8080"
    environment:
      # 1. 카프카 주소를 localhost가 아닌 서비스 이름 'kafka'로 변경
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # 2. FastAPI 주소도 서비스 이름 'fastapi'로 변경 (로드밸런싱용)
      - FASTAPI_URL=http://fastapi:8000
    depends_on:
      - kafka

  # FastAPI 4개 (Scale-out)
  fastapi:
    build: .
    deploy:
      replicas: 4
    expose:
      - "8000"
    environment:
      - MODEL_PATH=./isolation_forest.pkl

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./payment-system/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
